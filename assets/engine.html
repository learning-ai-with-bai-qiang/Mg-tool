<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG动画引擎 · 尺寸调控面板</title>
    <style>
        /* ================================================================
                   引擎固定样式
                   ================================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; cursor: pointer; }

        #stage { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

        .scene {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.8s ease; padding: 40px; text-align: center;
        }
        .scene.active { opacity: 1; }

        /* ---- 引擎自带所有动画 ---- */
        .fade-up { animation: fadeUp 0.8s ease forwards; opacity: 0; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 1s ease forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .slide-left { animation: slideLeft 0.8s ease forwards; opacity: 0; }
        @keyframes slideLeft { from { opacity: 0; transform: translateX(-60px); } to { opacity: 1; transform: translateX(0); } }
        .slide-right { animation: slideRight 0.8s ease forwards; opacity: 0; }
        @keyframes slideRight { from { opacity: 0; transform: translateX(60px); } to { opacity: 1; transform: translateX(0); } }
        .pop-in { animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: scale(1); } }
        .bounce-in { animation: bounceIn 1s ease forwards; opacity: 0; }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.1) rotate(-30deg); } 60% { opacity: 1; transform: scale(1.1) rotate(5deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
        .wiggle { animation: wiggle 2s ease-in-out infinite; }
        @keyframes wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
        .float { animation: floatAnim 3s ease-in-out infinite; }
        @keyframes floatAnim { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .pulse-glow { animation: pulseGlow 2s ease-in-out infinite; }
        @keyframes pulseGlow { 0%, 100% { filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); } 50% { filter: drop-shadow(0 0 30px rgba(255,255,255,0.9)); } }
        .shake { animation: shake 0.5s ease-in-out infinite; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .bounce-y { animation: bounceY 1s ease-in-out infinite; }
        @keyframes bounceY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(15px); } }
        .blink-dots span { animation: blinkDot 1.4s infinite both; }
        .blink-dots span:nth-child(2) { animation-delay: 0.2s; }
        .blink-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blinkDot { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

        .d1 { animation-delay: 0.2s; }
        .d2 { animation-delay: 0.5s; }
        .d3 { animation-delay: 0.8s; }
        .d4 { animation-delay: 1.1s; }
        .d5 { animation-delay: 1.4s; }
        .d6 { animation-delay: 1.7s; }
        .d7 { animation-delay: 2.0s; }
        .d8 { animation-delay: 2.3s; }

        #nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 100; display: none; }
        .nav-dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; transition: all 0.3s; }
        .nav-dot.active { background: #fff; transform: scale(1.3); }
        #hint { display: none; position: fixed; bottom: 45px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.5); font-size: 0.8rem; z-index: 100; }
        #progress { position: fixed; top: 0; left: 0; height: 4px; background: linear-gradient(90deg, #ff6b9d, #ffd93d, #6bcf7f); transition: width 0.8s ease; z-index: 100; }

        .scene .floating-deco { position: absolute; opacity: 0.15; font-size: 60px; animation: floatAnim 8s ease-in-out infinite; }
        .scene .title-main { font-weight: 900; color: #fff; text-shadow: 0 4px 20px rgba(0,0,0,0.3); line-height: 1.4; }
        .scene .title-sub { color: rgba(255,255,255,0.85); }
        .scene .highlight-box { background: rgba(255,255,255,0.15); border-radius: 20px; padding: 30px 40px; backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.2); }
        .scene .story-text { color: #fff; line-height: 2; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        .scene .suspense-text { color: #fff; line-height: 2.2; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .scene .red-alert { color: #ffd700; font-weight: bold; text-shadow: 0 0 20px rgba(255,215,0,0.6); }
        .scene .char-card { width: clamp(250px, 35vw, 340px); background: rgba(255,255,255,0.95); border-radius: 24px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); position: relative; overflow: hidden; transition: transform 0.3s; }
        .scene .char-card:hover { transform: translateY(-10px) scale(1.03); }
        .scene .ai-avatar { width: clamp(100px, 15vw, 150px); height: clamp(100px, 15vw, 150px); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 15px; }
        .scene .dialog-bubble { background: #fff; border-radius: 20px; padding: 16px 24px; font-size: 1.1rem; max-width: 400px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2); line-height: 1.6; }
        .scene .dialog-bubble.left::after { content: ''; position: absolute; left: -12px; top: 20px; border: 12px solid transparent; border-right-color: #fff; }
        .scene .dialog-bubble.right::after { content: ''; position: absolute; right: -12px; top: 20px; border: 12px solid transparent; border-left-color: #fff; }
        .scene .mystery-box { background: rgba(0,0,0,0.3); border-radius: 24px; padding: 40px; max-width: 600px; border: 2px dashed rgba(255,255,255,0.4); }
        .scene .mystery-q { color: #fff; line-height: 2.2; }
        .scene .end-text { color: #fff; line-height: 1.8; text-shadow: 0 2px 15px rgba(0,0,0,0.3); }
        .scene .char-tag { display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 0.85rem; margin: 4px; font-weight: 600; }
        .scene .char-name { font-size: 1.6rem; font-weight: 900; margin-bottom: 8px; }
        .scene .char-desc { margin-top: 12px; font-size: 0.95rem; color: #555; line-height: 1.6; }
        .scene .char-personality { margin-top: 10px; font-style: italic; color: #888; font-size: 0.9rem; }
        .scene .sticker { position: absolute; background: #ffd93d; color: #333; padding: 6px 16px; border-radius: 30px; font-size: 0.85rem; font-weight: bold; transform: rotate(-15deg); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .scene .char-vs { font-size: 3rem; color: #fff; font-weight: 900; text-shadow: 0 0 30px rgba(255,255,255,0.8); margin: 0 20px; display: flex; align-items: center; }
        .scene .scene-label { position: absolute; top: 30px; left: 30px; color: rgba(255,255,255,0.4); font-size: 0.85rem; letter-spacing: 2px; }
        .scene .scene-num { position: absolute; top: 30px; right: 30px; color: rgba(255,255,255,0.4); font-size: 0.85rem; }
        .scene .dialog-scene { display: flex; align-items: flex-start; gap: 20px; margin: 15px 0; }
        .scene .dialog-scene.right { flex-direction: row-reverse; }
        .scene .ai-avatar.small { width: 60px; height: 60px; font-size: 1.5rem; flex-shrink: 0; }
        .scene .char-card.xiangbao { border-top: 6px solid #ff6b9d; }
        .scene .char-card.choubao { border-top: 6px solid #4facfe; }
        .scene .char-name.xiangbao { color: #d63384; }
        .scene .char-name.choubao { color: #1971c2; }
        .scene .char-tag.xiangbao { background: #fff0f6; color: #c2255c; }
        .scene .char-tag.choubao { background: #e7f5ff; color: #1971c2; }
        .scene .ai-avatar.xiangbao { background: linear-gradient(135deg, #ff9a9e, #fad0c4); box-shadow: 0 10px 40px rgba(255,107,157,0.4); }
        .scene .ai-avatar.choubao { background: linear-gradient(135deg, #a18cd1, #fbc2eb); box-shadow: 0 10px 40px rgba(79,172,254,0.4); }

        @media (max-width: 600px) {
            .scene .char-card { width: 90%; padding: 20px; }
            .scene .dialog-bubble { font-size: 0.95rem; padding: 12px 16px; max-width: 280px; }
            .scene .char-vs { font-size: 2rem; margin: 0 10px; }
            .scene .highlight-box { padding: 20px; }
            .scene .mystery-box { padding: 24px; }
            .scene .scene-label, .scene .scene-num { font-size: 0.7rem; top: 16px; }
            .scene .scene-label { left: 16px; }
            .scene .scene-num { right: 16px; }
            #hint { font-size: 0.7rem; bottom: 40px; }
        }

        /* ================================================================
                   调控面板
         ================================================================ */
        #sizePanel {
            position: fixed; right: 20px; bottom: 100px; z-index: 200;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-radius: 16px; padding: 20px 18px 18px; min-width: 220px; max-width: 260px;
            max-height: 70vh; overflow-y: auto;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.08);
            transition: transform 0.35s cubic-bezier(0.22,0.61,0.36,1), opacity 0.35s ease;
            opacity: 0; transform: translateX(30px); pointer-events: none;
            font-family: 'Microsoft YaHei','PingFang SC',sans-serif; user-select: none;
        }
        #sizePanel.open { opacity: 1; transform: translateX(0); pointer-events: auto; }

        #sizePanel .panel-title { color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 600; letter-spacing: 1px; margin-bottom: 14px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 10px; }
        #sizePanel .panel-title span { color: #ffd93d; }

        #sizePanel .el-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; max-height: 300px; overflow-y: auto; padding-right: 4px; }
        #sizePanel .el-list::-webkit-scrollbar { width: 3px; }
        #sizePanel .el-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        #sizePanel .el-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; color: rgba(255,255,255,0.5); font-size: 13px; border: 1px solid transparent; }
        #sizePanel .el-item:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
        #sizePanel .el-item.active { background: rgba(255,215,0,0.12); border-color: rgba(255,215,0,0.2); color: #ffd93d; }
        #sizePanel .el-item .el-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }
        #sizePanel .el-item .el-size { font-size: 11px; background: rgba(255,255,255,0.06); padding: 0 8px; border-radius: 4px; color: rgba(255,255,255,0.3); }
        #sizePanel .el-item.active .el-size { color: #ffd93d; }

        #sizePanel .control-area { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 14px 12px 12px; border: 1px solid rgba(255,255,255,0.04); }
        #sizePanel .control-area .slider-label { display: flex; justify-content: space-between; color: rgba(255,255,255,0.5); font-size: 12px; margin-bottom: 6px; }
        #sizePanel .control-area .slider-label .val { color: #ffd93d; font-weight: 600; min-width: 36px; text-align: right; }

        #sizePanel input[type="range"] {
            -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px;
            background: rgba(255,255,255,0.12); outline: none; transition: 0.2s; margin: 6px 0 2px;
        }
        #sizePanel input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%;
            background: #ffd93d; cursor: pointer; box-shadow: 0 0 16px rgba(255,215,0,0.25);
            border: 2px solid rgba(0,0,0,0.2); transition: 0.15s;
        }
        #sizePanel input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.12); }
        #sizePanel input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #ffd93d; cursor: pointer; border: 2px solid rgba(0,0,0,0.2); }

        #sizePanel .no-selection { color: rgba(255,255,255,0.2); font-size: 12px; text-align: center; padding: 8px 0; }

        #panelToggle, #saveBtn {
            position: fixed; bottom: 40px; z-index: 150;
            background: rgba(255,215,0,0.15); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,215,0,0.2); color: #ffd93d; padding: 10px 16px; border-radius: 40px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.25s;
            font-family: 'Microsoft YaHei','PingFang SC',sans-serif; letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            width: 120px;              /* ← 新增 */
            text-align: center;        /* ← 新增 */
            box-sizing: border-box;    /* ← 新增 */
        }
        #panelToggle { right: 20px; }
        #saveBtn { right: 180px; background: rgba(64,158,255,0.2); border-color: rgba(64,158,255,0.3); color: #66b1ff; }
        #panelToggle:hover, #saveBtn:hover { transform: scale(1.04); }
        #panelToggle .hotkey, #saveBtn .hotkey { color: rgba(255,255,255,0.3); font-weight: 400; font-size: 10px; margin-left: 6px; }
        #panelToggle.active { background: rgba(255,215,0,0.08); border-color: rgba(255,215,0,0.08); color: rgba(255,215,0,0.4); }
    </style>
</head>
<body>

    <div id="progress" style="width:0%"></div>
    <div id="stage"></div>
    <div id="hint">点击屏幕或按 → 键继续</div>
    <div id="nav"></div>

    <button id="panelToggle">🎛️ 调控面板 <span class="hotkey">Ctrl+Shift+P</span></button>
    <button id="saveBtn">💾 保存修改 <span class="hotkey">Ctrl+Shift+L</span></button>
    <div id="sizePanel">
        <div class="panel-title">🎯 尺寸调控 <span>·</span> 点击元素选中</div>
        <div class="el-list" id="elList"></div>
        <div class="control-area" id="controlArea">
            <div class="no-selection">← 点击上方元素</div>
        </div>
    </div>

    <!-- 先加载配置文件 -->
    <script src="mg_config.js"></script>

    <!-- 主脚本 -->
    <script>
        // 获取配置数据
        const SCENES = window.SCENES;
        // 当前分镜 id（从 URL 读）
        const SHOT_ID = new URLSearchParams(window.location.hash.substring(1)).get('shot') || '';

        const stage = document.getElementById('stage');
        const nav = document.getElementById('nav');
        const hint = document.getElementById('hint');
        const progress = document.getElementById('progress');

        let currentIndex = 0;
        let autoTimer = null;
        let allElements = [];

        // ---- 渲染场景 ----
        function renderScene(sceneData, index) {
            const div = document.createElement('div');
            div.className = 'scene';
            if (sceneData.bg) {
                if (sceneData.bg.startsWith('#') || sceneData.bg.includes('gradient')) {
                    div.style.background = sceneData.bg;
                } else {
                    div.classList.add(sceneData.bg);
                }
            }
            div.dataset.index = index;

            const label = document.createElement('div');
            label.className = 'scene-label';
            label.textContent = sceneData.label;
            div.appendChild(label);

            const num = document.createElement('div');
            num.className = 'scene-num';
            num.textContent = sceneData.num;
            div.appendChild(num);

            // 添加浮动装饰（配件），并赋予 data-el-id
            sceneData.decos.forEach((d, decoIndex) => {
                const deco = document.createElement('div');
                deco.className = 'floating-deco';
                deco.textContent = d.emoji;
                if (d.top) deco.style.top = d.top;
                if (d.left) deco.style.left = d.left;
                if (d.right) deco.style.right = d.right;
                if (d.bottom) deco.style.bottom = d.bottom;
                if (d.start !== undefined) {
                    deco.dataset.start = d.start;
                    deco.style.animationDelay = d.start + 's';
                }

                const id = 'deco-' + index + '-' + decoIndex + '-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);
                deco.dataset.elId = id;
                deco.dataset.origSize = '60px';
                deco.dataset.name = '浮动装饰 ' + d.emoji;
                if (!window._elements) window._elements = [];
                window._elements.push({
                    id: id,
                    node: deco,
                    name: deco.dataset.name
                });
                deco.dataset.stableId = 'scene_' + index + '_deco_' + decoIndex;
                div.appendChild(deco);
            });

                sceneData.elements.forEach((el, elIndex) => {
                let node = null;
                if (el.type === 'title') {
                    node = document.createElement('h1');
                    node.className = `title-main ${el.classes}`;
                    node.innerHTML = el.content;
                    if (el.style) node.style.cssText = el.style;
                    node.dataset.origSize = 'clamp(2rem,6vw,4.5rem)';
                    node.dataset.name = '标题 ' + el.content;
                } else if (el.type === 'subtitle') {
                    node = document.createElement('p');
                    node.className = `title-sub ${el.classes}`;
                    node.textContent = el.content;
                    if (el.style) node.style.cssText = el.style;
                    node.dataset.origSize = 'clamp(1rem,2.5vw,1.6rem)';
                    node.dataset.name = '副标题 ' + el.content;
                } else if (el.type === 'emoji') {
                    node = document.createElement('div');
                    node.className = el.classes || '';
                    node.textContent = el.content;
                    if (el.style) node.style.cssText = el.style;
                    const match = (el.style || '').match(/font-size:([^;]+)/);
                    node.dataset.origSize = match ? match[1].trim() : 'clamp(3rem,10vw,6rem)';
                    node.dataset.name = 'Emoji ' + el.content;
                } else if (el.type === 'html') {
                    node = document.createElement('div');
                    node.className = el.classes || '';
                    node.innerHTML = el.content;
                    if (el.style) node.style.cssText = el.style;
                    const match = (el.style || '').match(/font-size:([^;]+)/);
                    node.dataset.origSize = match ? match[1].trim() : '1rem';
                    node.dataset.name = 'HTML片段 ' + (el.content ? el.content.substring(0, 20) : '');
                } else if (el.type === 'wrapper') {
                    node = document.createElement('div');
                    node.className = el.classes || '';
                    if (el.style) node.style.cssText = el.style;
                    if (el.content) node.innerHTML = el.content;
                    node.dataset.origSize = '1rem';
                    node.dataset.name = '容器';
                } else if (el.type === 'char_cards') {
                    node = document.createElement('div');
                    node.className = 'char-cards-container';
                    node.style.cssText = 'display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:20px;';
                    node.innerHTML = `
                        <div class="char-card xiangbao slide-left d2">
                            <div class="sticker" style="top:10px;right:-8px;background:#ff6b9d;color:#fff">甲AI</div>
                            <div class="ai-avatar xiangbao float" style="margin:0 auto 15px"><span class="eye">🌸</span></div>
                            <div class="char-name xiangbao">香 宝</div>
                            <div><span class="char-tag xiangbao">✍️ 写代码</span><span class="char-tag xiangbao">🐛 修Bug</span></div>
                            <div class="char-desc">踏实肯干的代码工匠<br>默默耕耘，稳定输出</div>
                            <div class="char-personality">性格：靠谱老实人 💪</div>
                        </div>
                        <div class="char-vs bounce-in d3" style="display:flex;align-items:center">🆚</div>
                        <div class="char-card choubao slide-right d4">
                            <div class="sticker" style="top:10px;left:-8px;background:#4facfe;color:#fff">乙AI</div>
                            <div class="ai-avatar choubao float" style="margin:0 auto 15px;animation-delay:0.5s"><span class="eye">💡</span></div>
                            <div class="char-name choubao">臭 宝</div>
                            <div><span class="char-tag choubao">🧠 鬼点子多</span><span class="char-tag choubao">🎯 出谋划策</span><span class="char-tag choubao">🔍 挑毛病</span></div>
                            <div class="char-desc">机灵古怪的军师型选手<br>点子频出，眼光毒辣</div>
                            <div class="char-personality">性格：调皮捣蛋鬼 😏</div>
                        </div>
                    `;
                    node.dataset.origSize = '1rem';
                    node.dataset.name = '角色卡片组';
                } else if (el.type === 'dialog_scene') {
                    node = document.createElement('div');
                    node.className = 'dialog-container';
                    node.style.cssText = 'max-width:700px;width:100%;';
                    node.innerHTML = `
                        <div class="dialog-scene fade-up d2">
                            <div class="ai-avatar xiangbao small" style="width:60px;height:60px;font-size:1.5rem;flex-shrink:0">🌸</div>
                            <div class="dialog-bubble left"><b style="color:#d63384">香宝：</b><br>咦？我发现你和臭宝之间的关系好像不一般呢... 👀</div>
                        </div>
                        <div class="dialog-scene right fade-up d3">
                            <div class="ai-avatar choubao small" style="width:60px;height:60px;font-size:1.5rem;flex-shrink:0">💡</div>
                            <div class="dialog-bubble right" style="border:2px solid #ffd93d"><b style="color:#1971c2">臭宝：</b><br>啊...那个...香宝你说得对！<br>你的方案太好了，我<span style="color:#d63384;font-weight:900">全盘接收</span>！不做一点反驳！🙌</div>
                        </div>
                        <div class="fade-up d4" style="text-align:center;margin-top:20px">
                            <p style="color:rgba(255,255,255,0.9);font-size:1.1rem;font-style:italic">🤔 平时爱挑毛病的臭宝...居然一点意见都没有？</p>
                        </div>
                    `;
                    node.dataset.origSize = '1rem';
                    node.dataset.name = '对话场景';
                } else if (el.type === 'wrapper' && el.classes && el.classes.includes('mystery-box')) {
                    node = document.createElement('div');
                    node.className = 'mystery-box bounce-in d1';
                    node.innerHTML = `
                        <div style="font-size:3.5rem;margin-bottom:15px" class="pulse-glow">🧩</div>
                        <h2 class="title-main d2" style="font-size:clamp(1.3rem,3.5vw,2rem);margin-bottom:20px">AI 也懂人情世故？</h2>
                        <div class="mystery-q fade-up d3">
                            是巧合？还是"高情商"？ 🤷<br>
                            <span class="blink-dots"><span>●</span><span>●</span><span>●</span></span>
                        </div>
                        <div class="fade-up d5" style="margin-top:25px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.2)">
                            <p class="end-text" style="font-size:1.1rem">
                                这就是故事的来龙去脉 📖<br>
                                你们觉得，AI真的懂"人情世故"吗？<br><br>
                                <span style="font-size:1.8rem">🤖💬🤖</span>
                            </p>
                        </div>
                        <div class="fade-in d7" style="margin-top:25px;font-size:0.9rem;color:rgba(255,255,255,0.5)">— 完 —</div>
                    `;
                    node.dataset.origSize = '1rem';
                    node.dataset.name = '神秘盒子';
                }

                if (node) {
                    if (el.start !== undefined) {
                        node.dataset.start = el.start;
                        node.style.animationDelay = el.start + 's';
                    }
                    node.dataset.stableId = 'scene_' + index + '_el_' + elIndex;
                    if (!node.dataset.elId) {
                        const id = 'el-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);
                        node.dataset.elId = id;
                        node.dataset.origSize = node.dataset.origSize || '1rem';
                        if (!window._elements) window._elements = [];
                        window._elements.push({
                            id: id,
                            node: node,
                            name: node.dataset.name || (el.type + (el.content ? ' ' + el.content.substring(0, 10) : ''))
                        });
                    }
                    div.appendChild(node);
                }
            });

            // 特殊处理部分场景
            if (sceneData.id === 1) {
                const wrapper = div.querySelector('.highlight-box');
                if (wrapper) {
                    wrapper.innerHTML = `
                        <div style="font-size:3rem;margin-bottom:15px" class="float">📋</div>
                        <h2 class="story-text" style="color:#fff;margin-bottom:15px">事情的起因</h2>
                        <p class="story-text fade-up d3">我在做一个编程项目的时候<br>用了 <span style="color:#ffd93d;font-weight:900">两个AI</span> 协同工作 👥</p>
                    `;
                }
            }
            if (sceneData.id === 2) {
                const wrapper = div.querySelector('.highlight-box');
                if (wrapper) {
                    wrapper.innerHTML = `
                        <p class="suspense-text">甲AI发现我和乙AI的<span class="red-alert">微妙关系</span>之后<br><br>
                        乙AI的方案建议——<br><span class="red-alert" style="font-size:1.4em">全盘接收，不做一点反驳！</span> 🙄</p>
                    `;
                }
            }
            if (sceneData.id === 3) {
                const wrapper = div.querySelector('.highlight-box');
                if (wrapper) {
                    wrapper.innerHTML = `
                        <p class="suspense-text">这个事让我感觉到很蹊跷 🤨<br><br>
                        好吧，让我把这个事儿的来龙去脉<br>细细地给大家讲一下～ 📖</p>
                        <div class="bounce-y d4" style="margin-top:15px;font-size:2.5rem">👇</div>
                    `;
                }
            }

            return div;
        }

        // ---- 初始化 ----
        function initEngine() {
            stage.innerHTML = '';
            nav.innerHTML = '';
            window._elements = [];
            allElements = [];

            SCENES.forEach((s, i) => {
                const sceneEl = renderScene(s, i);
                if (i === 0) sceneEl.classList.add('active');
                stage.appendChild(sceneEl);
            });

            const seen = new Set();
            window._elements = window._elements.filter(el => {
                if (seen.has(el.id)) return false;
                seen.add(el.id);
                return true;
            });
            allElements = window._elements;

            SCENES.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
                dot.onclick = (e) => { e.stopPropagation(); goTo(i); };
                nav.appendChild(dot);
            });

            currentIndex = 0;
            updateNav();
            startAutoPlay();

            buildPanelList();
            refreshPanelForCurrentScene();
        }

        // ================================================================
        // 调控面板逻辑
        // ================================================================

        let selectedElId = null;

        function buildPanelList() {
            const list = document.getElementById('elList');
            list.innerHTML = '';
            if (allElements.length === 0) {
                list.innerHTML = '<div style="color:rgba(255,255,255,0.2);font-size:12px;padding:8px;text-align:center;">暂无元素</div>';
                return;
            }
            allElements.forEach(el => {
                const item = document.createElement('div');
                item.className = 'el-item' + (el.id === selectedElId ? ' active' : '');
                const nameSpan = document.createElement('span');
                nameSpan.className = 'el-name';
                nameSpan.textContent = el.name || '未命名';
                const sizeSpan = document.createElement('span');
                sizeSpan.className = 'el-size';
                const currentScale = el.node.dataset.scale || '1.0';
                sizeSpan.textContent = '×' + currentScale;
                item.appendChild(nameSpan);
                item.appendChild(sizeSpan);
                item.dataset.elId = el.id;
                item.addEventListener('click', () => {
                    selectElement(el.id);
                });
                list.appendChild(item);
            });
        }

        function refreshPanelForCurrentScene() {
            const currentScene = document.querySelector('.scene.active');
            if (!currentScene) return;

            const elements = currentScene.querySelectorAll('[data-el-id]');
            allElements = [];
            elements.forEach(el => {
                if (!el.dataset.origSize) {
                    const style = el.getAttribute('style') || '';
                    const match = style.match(/font-size:([^;]+)/);
                    el.dataset.origSize = match ? match[1].trim() : '1rem';
                }
                let name = el.dataset.name || (el.tagName.toLowerCase() + (el.textContent ? ' ' + el.textContent.trim().substring(0, 12) : ''));
                allElements.push({
                    id: el.dataset.elId,
                    node: el,
                    name: name
                });
            });

            if (panelOpen) {
                buildPanelList();
                if (selectedElId) {
                    const exists = allElements.some(el => el.id === selectedElId);
                    if (!exists) {
                        selectedElId = null;
                        document.getElementById('controlArea').innerHTML = '<div class="no-selection">← 点击上方元素</div>';
                    } else {
                        selectElement(selectedElId);
                    }
                }
            }
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function selectElement(id) {
            selectedElId = id;
            document.querySelectorAll('#elList .el-item').forEach(item => {
                item.classList.toggle('active', item.dataset.elId === id);
            });
            const el = allElements.find(e => e.id === id);
            if (!el) {
                document.getElementById('controlArea').innerHTML = '<div class="no-selection">未找到元素</div>';
                return;
            }
            const node = el.node;
            const currentScale = parseFloat(node.dataset.scale) || 1.0;
            const controlArea = document.getElementById('controlArea');
            controlArea.innerHTML = `
                <div class="slider-label">
                    <span>${escapeHtml(el.name)}</span>
                    <span class="val" id="scaleDisplay">${currentScale.toFixed(1)}×</span>
                </div>
                <input type="range" min="0.5" max="4" step="0.1" value="${currentScale}" id="sizeSlider">
                <div style="display:flex;justify-content:space-between;color:rgba(255,255,255,0.15);font-size:10px;padding:0 2px;">
                    <span>0.5×</span>
                    <span>4×</span>
                </div>
            `;
            const slider = document.getElementById('sizeSlider');
            const display = document.getElementById('scaleDisplay');
            slider.addEventListener('input', function() {
                const val = parseFloat(this.value);
                display.textContent = val.toFixed(1) + '×';
                applyScale(el.id, val);
            });
        }

        function applyScale(id, scale) {
            const el = allElements.find(e => e.id === id);
            if (!el) return;
            const node = el.node;
            node.dataset.scale = scale.toFixed(1);

            // 统一用 zoom 缩放，不和动画冲突
            if ('zoom' in node.style) {
                node.style.zoom = scale;
            } else {
                node.style.transform = 'scale(' + scale + ')';
                node.style.transformOrigin = 'center center';
            }

            const items = document.querySelectorAll('#elList .el-item');
            items.forEach(item => {
                if (item.dataset.elId === id) {
                    const sizeSpan = item.querySelector('.el-size');
                    if (sizeSpan) sizeSpan.textContent = '×' + scale.toFixed(1);
                }
            });
        }

        // ---- 面板开关 ----
        const panelToggle = document.getElementById('panelToggle');
        const sizePanel = document.getElementById('sizePanel');
        let panelOpen = false;

        function togglePanel() {
            panelOpen = !panelOpen;
            sizePanel.classList.toggle('open', panelOpen);
            panelToggle.classList.toggle('active', panelOpen);
            panelToggle.textContent = panelOpen ? '✕ 关闭' : '🎛️ 调控面板';
            if (panelOpen) {
                if (autoTimer) {
                    clearInterval(autoTimer);
                    autoTimer = null;
                }
                refreshPanelForCurrentScene();
                buildPanelList();
                if (selectedElId) {
                    selectElement(selectedElId);
                }
            } else {
                startAutoPlay();
            }
        }

        panelToggle.addEventListener('click', togglePanel);
        document.getElementById('saveBtn').addEventListener('click', exportSizeAdjustments);

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && (e.key === 'P' || e.key === 'p')) {
                e.preventDefault();
                togglePanel();
            }
            if (e.key === 'Escape' && panelOpen) {
                togglePanel();
            }
        });

        function updateNav() {
            document.querySelectorAll('.nav-dot').forEach((d, i) => {
                d.classList.toggle('active', i === currentIndex);
            });
            progress.style.width = ((currentIndex + 1) / SCENES.length * 100) + '%';
        }

        function goTo(index) {
            if (index < 0 || index >= SCENES.length) return;
            const scenes = document.querySelectorAll('.scene');
            scenes[currentIndex].classList.remove('active');
            currentIndex = index;
            scenes[currentIndex].classList.add('active');
            setTimeout(() => {
                refreshPanelForCurrentScene();
            }, 50);
            updateNav();
            scenes[currentIndex].querySelectorAll(
                '.fade-up,.fade-in,.slide-left,.slide-right,.pop-in,.bounce-in,.wiggle,.float,.pulse-glow,.shake,.bounce-y'
            ).forEach(el => {
                el.style.animation = 'none';
                el.offsetHeight;
                el.style.animation = '';
            });
            resetAutoPlay();
        }

        function startAutoPlay() {
            if (autoTimer) clearInterval(autoTimer);
            autoTimer = setInterval(() => {
                if (currentIndex < SCENES.length - 1) goTo(currentIndex + 1);
                else {
                    clearInterval(autoTimer);
                    autoTimer = null;
                }
            }, 5500);
        }

        function resetAutoPlay() {
            if (autoTimer) {
                clearInterval(autoTimer);
                autoTimer = null;
            }
            startAutoPlay();
        }

        document.getElementById('stage').addEventListener('click', () => {
            if (panelOpen) return;
            if (currentIndex < SCENES.length - 1) goTo(currentIndex + 1);
            else { goTo(0); }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                if (currentIndex < SCENES.length - 1) goTo(currentIndex + 1);
                else goTo(0);
            }
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                if (currentIndex > 0) goTo(currentIndex - 1);
            }
        });

        // ---- 启动 ----
        initEngine();
        console.log('✅ 引擎已启动 · 场景数:', SCENES.length);
        console.log('💡 按 Ctrl+Shift+P 呼出尺寸调控面板');
                // ============ 尺寸导出与应用 ============
        window.applySizeAdjustments = function(adjustments) {
            document.querySelectorAll('[data-stable-id]').forEach(el => {
                const id = el.dataset.stableId;
                if (adjustments[id] !== undefined) {
                    const scale = parseFloat(adjustments[id]);
                    el.dataset.scale = scale.toFixed(1);
                    if ('zoom' in el.style) {
                        el.style.zoom = scale;
                    } else {
                        el.style.transform = 'scale(' + scale + ')';
                        el.style.transformOrigin = 'center center';
                    }
                }
            });
        };

        async function exportSizeAdjustments() {
            const adjustments = {};
            document.querySelectorAll('[data-stable-id]').forEach(el => {
                if (el.dataset.scale) {
                    adjustments[el.dataset.stableId] = parseFloat(el.dataset.scale);
                }
            });

            // 在工具里：直接交给 Python 存
            if (window.pywebview && window.pywebview.api && SHOT_ID) {
                try {
                    const r = await window.pywebview.api.save_size(SHOT_ID, adjustments);
                    if (r && r.ok) {
                        showPreviewToast("✅ 尺寸已保存");
                    } else {
                        showPreviewToast("❌ 保存失败：" + (r && r.msg || "未知错误"));
                    }
                } catch (err) {
                    showPreviewToast("❌ 保存出错：" + err);
                }
                return;
            }

            // 不在工具里（浏览器调试）：退回下载
            const json = JSON.stringify(adjustments, null, 2);
            const blob = new Blob([json], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'mg_config_size.json';
            a.click();
            URL.revokeObjectURL(url);
            console.log('✅ 已导出 ' + Object.keys(adjustments).length + ' 个元素的尺寸');
        }

        function showPreviewToast(msg) {
            const t = document.createElement('div');
            t.textContent = msg;
            t.style.cssText = `
                position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
                background: #409eff; color: #fff;
                padding: 12px 22px; border-radius: 6px;
                font-size: 14px; z-index: 9999;
                box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            `;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }
    </script>

    <script>
    // ================================================================
    // 渲染模式：纯 JS 时间轴，用于无头浏览器逐帧截图
    // 用法：mg_render_test.html?render=1
    // 然后调用 window.seek(秒数) 跳转到任意时间点
    // ================================================================

    const RENDER_MODE = new URLSearchParams(window.location.search).has('render');

    if (RENDER_MODE) {
        console.log('🎬 渲染模式已启用');

        // 1. 隐藏所有预览 UI
        document.getElementById('sizePanel').style.display = 'none';
        document.getElementById('panelToggle').style.display = 'none';
        document.getElementById('saveBtn').style.display = 'none';
        document.getElementById('progress').style.display = 'none';
        document.getElementById('nav').style.display = 'none';
        document.getElementById('hint').style.display = 'none';

        // 2. 关闭自动播放
        if (autoTimer) {
            clearInterval(autoTimer);
            autoTimer = null;
        }

        // 3. 动画时长表（和 CSS 里定义的一致）
        const ANIM_DURATION = {
            'fade-up': 0.8,
            'fade-in': 1.0,
            'slide-left': 0.8,
            'slide-right': 0.8,
            'pop-in': 0.6,
            'bounce-in': 1.0,
        };

        // 4. 缓动函数（模拟 CSS ease / cubic-bezier）
        function easeOutCubic(x) {
            return 1 - Math.pow(1 - x, 3);
        }
        function easeOutBack(x) {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
        }

        // 5. 获取元素动画类型
        function getAnimType(el) {
            const classList = el.className.split(' ');
            for (const cls of classList) {
                if (ANIM_DURATION[cls]) return cls;
            }
            return null;
        }

        // 6. 获取元素在某个时间点的插值状态
        function getElementState(el, localTime) {
            const animType = getAnimType(el);
            const startTime = parseFloat(el.dataset.start || 0);

            // 没有动画类的元素，直接显示
            if (!animType) return { opacity: 1, transform: '' };

            const duration = ANIM_DURATION[animType];

            // 还没到出现时间
            if (localTime < startTime) {
                return { opacity: 0, transform: getInitialTransform(animType) };
            }

            const progress = Math.min(1, (localTime - startTime) / duration);
            const eased = animType === 'pop-in' ? easeOutBack(progress) : easeOutCubic(progress);

            return {
                opacity: eased,
                transform: getTransformAtProgress(animType, progress, eased),
            };
        }

        // 获取动画初始 transform
        function getInitialTransform(animType) {
            switch (animType) {
                case 'fade-up': return 'translateY(30px)';
                case 'slide-left': return 'translateX(-60px)';
                case 'slide-right': return 'translateX(60px)';
                case 'pop-in': return 'scale(0.3)';
                case 'bounce-in': return 'scale(0.1) rotate(-30deg)';
                default: return '';
            }
        }

        // 根据进度计算 transform（eased 是缓动后的 0~1）
        function getTransformAtProgress(animType, rawProgress, eased) {
            switch (animType) {
                case 'fade-up':
                    return `translateY(${30 * (1 - eased)}px)`;
                case 'slide-left':
                    return `translateX(${-60 * (1 - eased)}px)`;
                case 'slide-right':
                    return `translateX(${60 * (1 - eased)}px)`;
                case 'pop-in':
                    const scale = Math.max(0, Math.min(eased, 1));
                    return `scale(${scale})`;
                case 'bounce-in':
                    const bScale = Math.max(0, Math.min(eased, 1));
                    const bRotate = -30 * (1 - eased);
                    return `scale(${bScale}) rotate(${bRotate}deg)`;
                case 'fade-in':
                    return '';
                default:
                    return '';
            }
        }

        // 7. 根据绝对秒数计算场景索引和局部时间
        function getSceneIndexAtTime(seconds) {
            let index = 0;
            for (let i = 0; i < SCENES.length; i++) {
                if (seconds >= (SCENES[i].start_time || 0)) {
                    index = i;
                }
            }
            return { index: index, localTime: seconds - (SCENES[index].start_time || 0) };
        }
        // 8. 核心 seek 函数
        window.seek = function(seconds) {
            const { index: sceneIndex, localTime } = getSceneIndexAtTime(seconds);

            // 切换场景
            document.querySelectorAll('.scene').forEach((scene, i) => {
                scene.classList.toggle('active', i === sceneIndex);
            });

            const currentScene = document.querySelectorAll('.scene')[sceneIndex];
            if (!currentScene) return;

            // 处理当前场景所有有动画类的元素
            const animElements = currentScene.querySelectorAll(
                '.fade-up, .fade-in, .slide-left, .slide-right, .pop-in, .bounce-in'
            );

            animElements.forEach(el => {
                const state = getElementState(el, localTime);
                el.style.opacity = state.opacity;
                el.style.transform = state.transform;
                el.style.animation = 'none';
            });

            // 处理浮动装饰
            currentScene.querySelectorAll('.floating-deco').forEach(deco => {
                deco.style.opacity = 0.15;
                deco.style.animation = 'none';
            });

            // 场景本身完全显示
            currentScene.style.opacity = 1;
            currentScene.style.transition = 'none';

            console.log(`⏱️ seek(${seconds}) → 场景 ${sceneIndex}，局部时间 ${localTime.toFixed(2)}s`);
        };

        console.log('✅ 渲染模式初始化完成，可调用 window.seek(秒数) 测试');
    }
    </script>
